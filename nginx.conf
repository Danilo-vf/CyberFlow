# Configuração do nginx do frontend (container "frontend" do docker-compose).
# Montar em /etc/nginx/conf.d/default.conf (substitui o server padrão da imagem).
server {
    listen 80;
    server_name _;

    # Tela: index.html, app.js e style.css
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API: /api/incidentes -> http://backend:5000/incidentes
    # A barra final em proxy_pass remove o prefixo /api antes de repassar.
    location /api/ {
        proxy_pass http://backend:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
