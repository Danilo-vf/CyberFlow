name: CI

on:
  push:
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build (instalar dependências)
        run: pip install -r requirements.txt

      - name: Rodar testes
        env:
          PYTHONPATH: .
        run: pytest
