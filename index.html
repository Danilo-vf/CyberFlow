<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberFlow - Gestão de Incidentes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topbar">
        <h1><span class="highlight">Cyber</span>Flow</h1>
        <p>Centro de Operações de Segurança (SOC)</p>
    </header>

    <div class="container">
        <!-- Coluna Esquerda: Formulário -->
        <aside class="panel form-panel">
            <h2 id="form-title">Registrar Incidente</h2>
            <form id="incident-form">
                <input type="hidden" id="incidente-id">

                <div class="form-group">
                    <label for="titulo">Título do Incidente</label>
                    <input type="text" id="titulo" name="titulo" required placeholder="Ex: E-mail malicioso RH">
                </div>

                <!-- AQUI ESTÁ A MUDANÇA: Categoria agora é o Tipo de Ataque -->
                <div class="form-group">
                    <label for="categoria">Categoria (Tipo de Ataque)</label>
                    <input type="text" id="categoria" name="categoria" required placeholder="Ex: Phishing, Ransomware..." list="lista-categorias">
                    
                    <!-- Datalist cria sugestões automáticas ao clicar no campo -->
                    <datalist id="lista-categorias">
                        <option value="Phishing">
                        <option value="Ransomware">
                        <option value="Malware">
                        <option value="DDoS">
                        <option value="Vazamento de Dados">
                        <option value="Engenharia Social">
                        <option value="Acesso Indevido">
                    </datalist>
                </div>

                <div class="form-group">
                    <label for="status">Status</label>
                    <select id="status" name="status" required>
                        <option value="Aberto">Aberto</option>
                        <option value="Em Análise">Em Análise</option>
                        <option value="Resolvido">Resolvido</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="descricao">Descrição</label>
                    <textarea id="descricao" name="descricao" rows="4" required placeholder="Detalhes técnicos do evento..."></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" id="btn-salvar">Salvar Incidente</button>
                    <button type="button" class="btn btn-secondary" id="btn-cancelar" style="display: none;">Cancelar Edição</button>
                </div>
            </form>
        </aside>

        <!-- Coluna Direita: Tabela -->
        <main class="panel table-panel">
            <h2>Painel de Incidentes</h2>
            <div class="table-responsive">
                <table id="incident-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Título</th>
                            <th>Categoria</th>
                            <th>Status</th>
                            <th>Descrição</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <!-- Os dados serão injetados aqui via JavaScript -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
